# 毎朝、決めた銘柄の予測・バックテストを計算し直して frontend/public/nightly.json を更新する。
# 対象の銘柄は backend/nightly_tickers.txt で増減できる。
name: nightly

on:
  schedule:
    # 火〜土の 7:00（日本時間）= 月〜金の 22:00（UTC）。日本株・米国株とも前日の終値が出そろった後
    - cron: "0 22 * * 1-5"
  workflow_dispatch: # Actions の画面から手動でも実行できるようにする

permissions:
  contents: write # 結果をコミットして push するため

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 依存ライブラリを入れる
        working-directory: backend
        run: pip install -r requirements.txt

      - name: 予測・バックテストを計算する
        working-directory: backend
        run: python -m app.nightly --tickers nightly_tickers.txt --out ../frontend/public/nightly.json

      - name: 結果をコミットする
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/nightly.json
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "毎朝の予測を更新（$(TZ=Asia/Tokyo date +%Y-%m-%d)）"
          git push
